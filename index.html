<!DOCTYPE html>
<html lang="he" dir="rtl" class="scroll-smooth no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AURA - Digital Solutions for Enterprise">
    <title>AURA | Digital Future</title>

    <!-- PWA & SEO -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <meta name="theme-color" content="#0f172a">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- CSS Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- JS Libraries -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        // Remove no-js class immediately to enable JS features
        document.documentElement.classList.remove('no-js');
        document.documentElement.classList.add('js');

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Heebo', 'sans-serif'],
                        en: ['Inter', 'sans-serif']
                    },
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .gradient-text { background-clip: text; -webkit-background-clip: text; color: transparent; background-image: linear-gradient(to right, #3b82f6, #a855f7); }
        
        /* Fail-Safe: If JS fails, ensure content is visible */
        .no-js [data-aos] { opacity: 1 !important; transform: none !important; transition: none !important; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>

<body class="bg-slate-900 text-slate-50 antialiased overflow-x-hidden" 
      x-data="app()" 
      :dir="lang === 'he' ? 'rtl' : 'ltr'"
      :class="lang === 'he' ? 'font-sans' : 'font-en'">

    <!-- Skip Link (A11y) -->
    <a href="#main" class="fixed top-0 left-0 -translate-y-full focus:translate-y-0 bg-brand-600 text-white p-3 z-[100] transition-transform shadow-xl font-bold rounded-b-lg focus:outline-none focus:ring-4 focus:ring-white">
        <span x-text="t.skip_content"></span>
    </a>

    <!-- Header -->
    <header class="fixed w-full top-0 z-50 transition-all duration-300"
            :class="scrolled ? 'glass py-3' : 'bg-transparent py-5'"
            data-aos="fade-down" data-aos-duration="800">
        <div class="container mx-auto px-6 flex items-center justify-between">
            
            <!-- Logo -->
            <a href="#" class="text-2xl font-black tracking-tighter flex items-center gap-2 group">
                <div class="w-8 h-8 bg-gradient-to-tr from-brand-600 to-purple-600 rounded-lg flex items-center justify-center text-white text-lg shadow-lg shadow-brand-500/30 group-hover:scale-110 transition">A</div>
                <span>AURA</span>
            </a>

            <!-- Desktop Nav -->
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="#services" class="hover:text-brand-400 transition" x-text="t.nav_services"></a>
                <a href="#work" class="hover:text-brand-400 transition" x-text="t.nav_work"></a>
                <a href="#about" class="hover:text-brand-400 transition" x-text="t.nav_about"></a>
                
                <!-- Lang Switcher -->
                <button @click="toggleLang()" class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-white/10 hover:bg-white/5 transition text-xs font-bold tracking-wide">
                    <span x-text="lang === 'he' ? 'EN' : 'עב'"></span>
                    <div class="w-4 h-4 rounded-full bg-slate-700 flex items-center justify-center text-[10px]">🌐</div>
                </button>

                <a href="#contact" class="px-6 py-2.5 bg-white text-slate-900 rounded-full font-bold hover:scale-105 transition shadow-lg shadow-white/10" x-text="t.cta_talk"></a>
            </nav>

            <!-- Mobile Menu Button -->
            <button @click="mobileOpen = !mobileOpen" class="md:hidden p-2 text-2xl text-slate-200" :aria-label="t.menu_toggle">
                <span x-show="!mobileOpen">☰</span>
                <span x-show="mobileOpen">✕</span>
            </button>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div x-show="mobileOpen" x-collapse class="md:hidden glass border-t border-white/10 absolute w-full top-full left-0">
            <nav class="flex flex-col p-6 gap-6 text-center text-lg font-medium">
                <a @click="mobileOpen = false" href="#services" x-text="t.nav_services"></a>
                <a @click="mobileOpen = false" href="#work" x-text="t.nav_work"></a>
                <a @click="mobileOpen = false" href="#about" x-text="t.nav_about"></a>
                <a @click="mobileOpen = false" href="#contact" class="text-brand-400 font-bold" x-text="t.cta_talk"></a>
                <div class="h-px bg-white/10 w-full my-2"></div>
                <button @click="toggleLang()" class="text-sm opacity-70 flex items-center justify-center gap-2">
                    <span x-text="lang === 'he' ? 'Switch to English' : 'החלף לעברית'"></span>
                </button>
            </nav>
        </div>
    </header>

    <main id="main">
        <!-- Hero -->
        <section class="min-h-screen flex items-center justify-center relative overflow-hidden">
            <!-- Dynamic BG -->
            <div class="absolute inset-0 bg-cover bg-center opacity-40 transition-opacity duration-1000 scale-105 animate-pulse-slow" 
                 style="background-image: url('hero.jpg?v=2'); animation: pulse 20s infinite;"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/80 to-slate-900/30"></div>

            <div class="container mx-auto px-6 relative z-10 text-center pt-20">
                <div class="inline-block px-4 py-1.5 mb-8 rounded-full border border-brand-500/30 bg-brand-500/10 text-brand-300 text-xs tracking-[0.2em] uppercase font-bold backdrop-blur-sm" data-aos="fade-down" data-aos-delay="100">
                    <span x-text="t.hero_badge"></span>
                </div>
                
                <h1 class="text-5xl md:text-8xl font-black leading-[1.1] mb-8 tracking-tight drop-shadow-2xl" data-aos="zoom-in" data-aos-duration="1000">
                    <span x-text="t.hero_title_1"></span><br>
                    <span class="gradient-text" x-text="t.hero_title_2"></span>
                </h1>
                
                <p class="text-xl md:text-2xl text-slate-300 max-w-2xl mx-auto mb-12 leading-relaxed font-light" data-aos="fade-up" data-aos-delay="300" x-text="t.hero_desc"></p>
                
                <div class="flex flex-col sm:flex-row justify-center gap-5" data-aos="fade-up" data-aos-delay="500">
                    <a href="#contact" class="px-8 py-4 bg-brand-600 text-white rounded-full font-bold text-lg hover:bg-brand-500 hover:scale-105 transition shadow-lg shadow-brand-600/30" x-text="t.cta_primary"></a>
                    <a href="#work" class="px-8 py-4 border border-white/20 bg-white/5 backdrop-blur-sm rounded-full font-bold text-lg hover:bg-white/10 transition flex items-center justify-center gap-2">
                        <span x-text="t.cta_secondary"></span>
                        <span class="text-xl">→</span>
                    </a>
                </div>
            </div>
        </section>

        <!-- Services (Bento Grid Style) -->
        <section id="services" class="py-32 bg-slate-900 relative">
            <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-brand-900/20 to-slate-900 pointer-events-none"></div>
            
            <div class="container mx-auto px-6 relative z-10">
                <div class="text-center mb-20" data-aos="fade-up">
                    <h2 class="text-4xl md:text-5xl font-black mb-6" x-text="t.services_title"></h2>
                    <div class="h-1 w-24 bg-brand-500 mx-auto rounded-full"></div>
                </div>
                
                <div class="grid md:grid-cols-3 gap-8">
                    <template x-for="(service, index) in t.services_list">
                        <div class="bg-slate-800/50 backdrop-blur-sm p-10 rounded-3xl border border-white/5 hover:border-brand-500/50 transition duration-500 group hover:-translate-y-2" 
                             :data-aos="'fade-up'" 
                             :data-aos-delay="index * 100">
                            <div class="w-16 h-16 bg-slate-700/50 rounded-2xl flex items-center justify-center text-4xl mb-8 group-hover:scale-110 group-hover:bg-brand-500/20 transition duration-500" x-text="service.icon"></div>
                            <h3 class="text-2xl font-bold mb-4" x-text="service.title"></h3>
                            <p class="text-slate-400 leading-relaxed" x-text="service.desc"></p>
                        </div>
                    </template>
                </div>
            </div>
        </section>

        <!-- Portfolio (Cards with Hover) -->
        <section id="work" class="py-32 bg-slate-950">
            <div class="container mx-auto px-6">
                <div class="flex flex-col md:flex-row justify-between items-end mb-16 gap-6" data-aos="fade-right">
                    <div>
                        <h2 class="text-4xl md:text-5xl font-black mb-4" x-text="t.work_title"></h2>
                        <p class="text-slate-400 text-lg" x-text="t.work_subtitle"></p>
                    </div>
                    <a href="#contact" class="text-brand-400 font-bold hover:text-brand-300 transition flex items-center gap-2 group">
                        <span x-text="lang === 'he' ? 'כל הפרויקטים' : 'View All Projects'"></span>
                        <span class="group-hover:translate-x-1 transition-transform rtl:group-hover:-translate-x-1">→</span>
                    </a>
                </div>
                
                <div class="grid md:grid-cols-3 gap-8">
                    <!-- Project 1 -->
                    <div class="group relative aspect-[4/3] bg-slate-900 rounded-2xl overflow-hidden cursor-pointer shadow-2xl" data-aos="flip-left" data-aos-duration="1000">
                        <img src="project1.jpg" alt="FinTech Dashboard" class="object-cover w-full h-full transition duration-700 group-hover:scale-110 opacity-80 group-hover:opacity-100">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent flex flex-col justify-end p-8 translate-y-4 group-hover:translate-y-0 transition duration-500">
                            <h3 class="text-2xl font-bold text-white mb-1">FinTech Dash</h3>
                            <p class="text-brand-400 font-medium">React • Node.js</p>
                        </div>
                    </div>
                    <!-- Project 2 -->
                    <div class="group relative aspect-[4/3] bg-slate-900 rounded-2xl overflow-hidden cursor-pointer shadow-2xl" data-aos="flip-left" data-aos-delay="150" data-aos-duration="1000">
                        <img src="project2.jpg" alt="E-Commerce AI" class="object-cover w-full h-full transition duration-700 group-hover:scale-110 opacity-80 group-hover:opacity-100">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent flex flex-col justify-end p-8 translate-y-4 group-hover:translate-y-0 transition duration-500">
                            <h3 class="text-2xl font-bold text-white mb-1">E-Commerce AI</h3>
                            <p class="text-brand-400 font-medium">Shopify • Python</p>
                        </div>
                    </div>
                    <!-- Project 3 -->
                    <div class="group relative aspect-[4/3] bg-slate-900 rounded-2xl overflow-hidden cursor-pointer shadow-2xl" data-aos="flip-left" data-aos-delay="300" data-aos-duration="1000">
                        <img src="project3.jpg" alt="Cyber Security" class="object-cover w-full h-full transition duration-700 group-hover:scale-110 opacity-80 group-hover:opacity-100">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent flex flex-col justify-end p-8 translate-y-4 group-hover:translate-y-0 transition duration-500">
                            <h3 class="text-2xl font-bold text-white mb-1">CyberGuard</h3>
                            <p class="text-brand-400 font-medium">Next.js • WebGL</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Contact (Netlify Forms) -->
        <section id="contact" class="py-32 relative overflow-hidden">
            <!-- Background Glow -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-brand-600/10 rounded-full blur-[120px] pointer-events-none"></div>

            <div class="container mx-auto px-6 max-w-2xl relative z-10">
                <div class="text-center mb-12" data-aos="fade-down">
                    <h2 class="text-4xl md:text-6xl font-black mb-6" x-text="t.contact_title"></h2>
                    <p class="text-slate-400 text-lg">בוא נהפוך את הרעיון שלך למציאות. אנחנו כאן.</p>
                </div>
                
                <form name="contact" method="POST" data-netlify="true" class="space-y-6 text-start bg-slate-800/30 backdrop-blur-md p-8 md:p-12 rounded-3xl border border-white/10 shadow-2xl" data-aos="zoom-in-up">
                    <input type="hidden" name="form-name" value="contact">
                    
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label for="name" class="block text-xs font-bold uppercase tracking-wider mb-2 text-slate-400" x-text="t.form_name"></label>
                            <input type="text" name="name" id="name" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-4 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition placeholder-slate-600">
                        </div>
                        <div>
                            <label for="email" class="block text-xs font-bold uppercase tracking-wider mb-2 text-slate-400" x-text="t.form_email"></label>
                            <input type="email" name="email" id="email" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-4 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition placeholder-slate-600">
                        </div>
                    </div>

                    <div>
                        <label for="message" class="block text-xs font-bold uppercase tracking-wider mb-2 text-slate-400" x-text="t.form_message"></label>
                        <textarea name="message" id="message" rows="5" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-4 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition placeholder-slate-600"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-brand-600 to-purple-600 text-white font-black py-5 rounded-xl transition transform hover:-translate-y-1 hover:shadow-2xl hover:shadow-brand-500/40 text-lg">
                        <span x-text="t.form_submit"></span>
                    </button>
                </form>
            </div>
        </section>

        <!-- Footer -->
        <footer class="py-12 border-t border-white/5 bg-black text-center text-slate-500 text-sm">
            <div class="container mx-auto px-6">
                <div class="flex justify-center gap-6 mb-8 text-2xl opacity-50">
                    <a href="#" class="hover:text-white transition">🐦</a>
                    <a href="#" class="hover:text-white transition">💼</a>
                    <a href="#" class="hover:text-white transition">📸</a>
                </div>
                <p>&copy; 2026 AURA Digital. <span x-text="t.footer_rights"></span></p>
            </div>
        </footer>

        <!-- Back to Top -->
        <button @click="window.scrollTo({top: 0, behavior: 'smooth'})" 
                x-show="scrolled" 
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 translate-y-10"
                x-transition:enter-end="opacity-100 translate-y-0"
                x-transition:leave="transition ease-in duration-300"
                x-transition:leave-start="opacity-100 translate-y-0"
                x-transition:leave-end="opacity-0 translate-y-10"
                class="fixed bottom-8 left-8 z-40 bg-white text-brand-900 p-4 rounded-full shadow-2xl hover:scale-110 transition hover:bg-brand-50"
                :aria-label="t.back_to_top">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
        </button>

    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Senior-Level Initialization with Safety Check
        document.addEventListener('DOMContentLoaded', function() {
            // Check if AOS loaded
            if (typeof AOS !== 'undefined') {
                AOS.init({
                    once: true,
                    offset: 50,
                    duration: 800,
                    easing: 'ease-out-cubic',
                    disable: 'mobile' // Optional: Disable heavy animations on mobile if needed, but we'll keep them for now
                });
            } else {
                console.warn('AOS not loaded - Animations disabled for safety.');
            }
            
            // Force show content after 2 seconds even if something stuck
            setTimeout(() => {
                const hiddenElements = document.querySelectorAll('[data-aos]');
                hiddenElements.forEach(el => {
                    if (getComputedStyle(el).opacity === '0' || getComputedStyle(el).visibility === 'hidden') {
                        el.style.opacity = '1';
                        el.style.visibility = 'visible';
                    }
                });
            }, 2000);
        });

        function app() {
            return {
                lang: 'he',
                mobileOpen: false,
                scrolled: false,
                
                init() {
                    window.addEventListener('scroll', () => {
                        this.scrolled = window.scrollY > 50;
                    });
                },

                toggleLang() {
                    this.lang = this.lang === 'he' ? 'en' : 'he';
                    // Re-trigger AOS to recalculate positions after layout change
                    setTimeout(() => AOS.refresh(), 100);
                },

                get t() {
                    const dict = {
                        he: {
                            skip_content: 'דלג לתוכן המרכזי',
                            nav_services: 'שירותים',
                            nav_work: 'פרויקטים',
                            nav_about: 'אודות',
                            cta_talk: 'דבר איתנו',
                            menu_toggle: 'פתח תפריט',
                            hero_badge: 'העתיד הדיגיטלי',
                            hero_title_1: 'בונים חוויות',
                            hero_title_2: 'שמשנות את החוקים',
                            hero_desc: 'אנחנו ב-AURA משלבים עיצוב עילית, קוד מדויק ואסטרטגיה עסקית כדי להפוך את המותג שלך למוביל שוק.',
                            cta_primary: 'בוא נתחיל',
                            cta_secondary: 'תיק עבודות',
                            services_title: 'המומחיות שלנו',
                            services_list: [
                                {icon: '💻', title: 'פיתוח Full Stack', desc: 'מערכות מורכבות, דשבורדים ואתרי תדמית סופר-מהירים.'},
                                {icon: '🎨', title: 'עיצוב UI/UX', desc: 'ממשקים שמשתמשים מתאהבים בהם ממבט ראשון.'},
                                {icon: '🚀', title: 'צמיחה ו-SEO', desc: 'אופטימיזציה למנועי חיפוש וביצועים מקסימליים.'}
                            ],
                            work_title: 'עבודות אחרונות',
                            work_subtitle: 'איכות ללא פשרות',
                            contact_title: 'מוכנים להמריא?',
                            form_name: 'שם מלא',
                            form_email: 'כתובת אימייל',
                            form_message: 'על הפרויקט',
                            form_submit: 'שלח פרטים 🚀',
                            footer_rights: 'כל הזכויות שמורות.',
                            back_to_top: 'חזור למעלה'
                        },
                        en: {
                            skip_content: 'Skip to main content',
                            nav_services: 'Services',
                            nav_work: 'Work',
                            nav_about: 'About',
                            cta_talk: 'Let\'s Talk',
                            menu_toggle: 'Open Menu',
                            hero_badge: 'The Digital Future',
                            hero_title_1: 'Building Experiences',
                            hero_title_2: 'That Break The Rules',
                            hero_desc: 'At AURA, we blend elite design, precise code, and business strategy to turn your brand into a market leader.',
                            cta_primary: 'Get Started',
                            cta_secondary: 'View Work',
                            services_title: 'Our Expertise',
                            services_list: [
                                {icon: '💻', title: 'Full Stack Dev', desc: 'Complex systems, dashboards, and blazing fast sites.'},
                                {icon: '🎨', title: 'UI/UX Design', desc: 'Interfaces that users fall in love with at first sight.'},
                                {icon: '🚀', title: 'Growth & SEO', desc: 'Search engine optimization and maximum performance.'}
                            ],
                            work_title: 'Recent Work',
                            work_subtitle: 'Quality without compromise',
                            contact_title: 'Ready to Launch?',
                            form_name: 'Full Name',
                            form_email: 'Email Address',
                            form_message: 'About the Project',
                            form_submit: 'Send Message 🚀',
                            footer_rights: 'All rights reserved.',
                            back_to_top: 'Back to Top'
                        }
                    };
                    return dict[this.lang];
                }
            }
        }
    </script>
</body>
</html>
